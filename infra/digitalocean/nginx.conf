# The certificate challenge must remain reachable over plain HTTP.
server {
    listen 80;
    server_name enerqa.co.uk www.enerqa.co.uk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://www.enerqa.co.uk$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name enerqa.co.uk;
    ssl_certificate /etc/letsencrypt/live/enerqa.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enerqa.co.uk/privkey.pem;
    return 308 https://www.enerqa.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name www.enerqa.co.uk;
    ssl_certificate /etc/letsencrypt/live/enerqa.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enerqa.co.uk/privkey.pem;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 330s;
    }
}
